site:
  name: ENCORE
  site: 'https://www.encore-tech.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: ENCORE - Professional Track Lighting & LED Downlight Manufacturer
    template: '%s — ENCORE'
  description: "Shenzhen Encore Optoelectronic Technology Co., Ltd. is a professional track lighting and LED downlight manufacturer offering OEM/ODM services. ETL/CE/ISO certified factory."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: ENCORE
    images:
      - url: '~/assets/images/logo.png'
        width: 4124
        height: 834
    type: website
  twitter:
    handle: '@encore'
    site: '@encore'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
